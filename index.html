<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROMI - Subarna Mostafa Promi</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #fdfbf8;
    color: #1a1a1a;
    font-family: 'Hind Siliguri', sans-serif;
    line-height: 1.6;
  }

  /* ===== HERO ===== */
  .hero {
    max-width: 1240px;
    margin: 0 auto;
    padding: 50px 24px 40px;
    display: grid;
    grid-template-columns: 1.05fr 0.95fr;
    gap: 50px;
    align-items: center;
  }

  @media (max-width: 900px) {
    .hero {
      grid-template-columns: 1fr;
      gap: 30px;
      padding-top: 30px;
    }
  }

  .hero-img {
    width: 100%;
    height: 620px;
    object-fit: cover;
    border-radius: 32px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12);
    transition: transform 0.5s ease;
  }

  .hero-img:hover {
    transform: scale(1.02);
  }

  .hero-text h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(48px, 8vw, 78px);
    line-height: 0.95;
    font-weight: 700;
    letter-spacing: -1px;
    color: #111;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #111;
    color: #fff;
    padding: 14px 28px;
    border-radius: 100px;
    margin-top: 28px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }

  /* ===== WRAP ===== */
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 10px 20px 60px;
  }

  /* ===== GALLERY ===== */
  .gallery-section {
    background: #fff;
    border: 1px solid #f0e9e2;
    border-radius: 28px;
    padding: 36px 28px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
  }

  .gallery-section h3 {
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 28px;
    color: #222;
  }

  .masonry {
    columns: 2;
    column-gap: 18px;
  }

  @media (max-width: 700px) {
    .masonry {
      columns: 1;
    }
  }

  .masonry img {
    width: 100%;
    border-radius: 22px;
    margin-bottom: 18px;
    object-fit: cover;
    display: block;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    transition: all 0.4s ease;
    cursor: pointer;
  }

  .masonry img:hover {
    transform: translateY(-6px);
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.14);
  }

  /* ===== FOOTER ===== */
  .footer {
    text-align: center;
    padding: 50px 20px;
    background: #111;
    color: #999;
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  .footer span {
    color: #fff;
    font-weight: 500;
  }
</style>
</head>
<body>

  <!-- HERO -->
  <div class="hero">
    <img class="hero-img" src="promi1.jpg" alt="Promi">
    <div class="hero-text">
      <h1>SUBARNA<br>MOSTAFA<br>PROMI</h1>
      <div class="badge">🎂 ২১ অক্টোবর &nbsp;|&nbsp; 21 October</div>
    </div>
  </div>

  <!-- GALLERY -->
  <div class="wrap">
    <div class="gallery-section">
      <h3>📸 Promi's Gallery</h3>
      <div class="masonry">
        <img src="promi1.jpg" alt="Promi 1">
        <img src="promi2.jpg" alt="Promi 2">
        <img src="promi3.jpg" alt="Promi 3">
        <img src="promi1.jpg" alt="Promi 1">
        <img src="promi2.jpg" alt="Promi 2">
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    Developer by <span>Seyam</span>
  </div>

</body>
  </html>
