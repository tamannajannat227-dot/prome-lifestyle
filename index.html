<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subarna Mostafa Promi</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FEFEFE;font-family:'Hind Siliguri',sans-serif}
.header{text-align:center;padding:50px 15px;background:#f8f5f2}
.avatar{width:250px;height:250px;border-radius:50%;object-fit:cover;border:8px solid #fff;box-shadow:0 15px 40px rgba(0,0,0,0.2)}
.name{font-family:'Cormorant Garamond';font-size:42px;margin-top:18px;font-weight:600}
.name-en{font-size:14px;letter-spacing:3px;color:#999;margin-top:4px}
.bday{background:#1a1a1a;color:#fff;padding:10px 25px;border-radius:100px;display:inline-block;margin-top:18px}
.social{display:flex;justify-content:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.social a{text-decoration:none;background:#fff;border:1px solid #eee;padding:12px 24px;border-radius:100px;color:#1a1a1a}
.section{max-width:900px;margin:0 auto;padding:20px 15px}
.card{background:#fff;border:1px solid #f0e9e2;border-radius:20px;padding:22px;margin-bottom:16px;line-height:1.8}
.dream{background:#1a1a1a;color:#fff;border-radius:20px;padding:30px;text-align:center;margin-bottom:16px}
.gallery-img{width:100%;border-radius:20px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,0.15)}
.big-img{height:500px}
@media(max-width:650px){.big-img{height:auto}}
.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:650px){.gallery-grid{grid-template-columns:1fr}}
.footer{text-align:center;padding:50px 20px;background:#faf7f4}
.madeby{margin-top:20px;display:inline-block;background:#1a1a1a;color:#fff;padding:12px 28px;border-radius:100px}
</style>
</head>
<body>
<div class="header">
  <img class="avatar" src="promi1.jpg">
  <div class="name">সুবর্ণা মোস্তফা প্রমি</div>
  <div class="name-en">SUBARNA MOSTAFA PROMI</div>
  <div class="bday">🎂 21 October | ২১ অক্টোবর</div>
  <div class="social">
    <a href="https://www.instagram.com/violex_005" target="_blank">📸 Instagram</a>
    <a href="https://vm.tiktok.com/ZS9UrrG6C8S2M-RxvwA/" target="_blank">🎵 TikTok</a>
  </div>
</div>
<div class="section">
<div class="card">
<h3>👩‍🎓 আমার সম্পর্কে</h3>
<p>আমি প্রমি, নবম শ্রেণির একজন ছাত্রী।</p>
</div>
<div class="card" style="text-align:center;padding:10px">
<h3 style="padding:15px">📸 Promi's Gallery - Full Size</h3>
<img src="promi1.jpg" class="gallery-img big-img" alt="Promi 1">
<div class="gallery-grid">
<img src="promi1.jpg" class="gallery-img" alt="Promi 1">
<img src="promi2.jpg" class="gallery-img" alt="Promi 2">
</div>
</div>
<div class="dream">
<h2>✨ আমার স্বপ্ন: শিক্ষক হওয়া</h2>
</div>
</div>
<div class="footer">
<div>Made By Seyam 🖤</div>
</div>
</body>
  </html>
